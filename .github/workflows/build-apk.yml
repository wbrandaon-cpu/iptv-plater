name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Gerar mapa de logos oficiais dos canais
        run: |
          mkdir -p app/src/main/assets
          python3 tools/build_logo_map.py app/src/main/assets/channel_logos.json

      - name: Compilar APK
        run: |
          set -o pipefail
          gradle assembleVerdeDebug assembleRosaDebug --no-daemon 2>&1 | tee build.log || {
            # Mostra os erros de compilação como anotações (visíveis na página do build)
            grep -E "^e: |error:|What went wrong" -A3 build.log | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          }

      - name: Renomear APK
        run: |
          cp app/build/outputs/apk/verde/debug/app-verde-debug.apk IPTVPlayer.apk
          cp app/build/outputs/apk/rosa/debug/app-rosa-debug.apk IPTVPlayer-Rosa.apk

      - name: Guardar APK nos artefatos
        uses: actions/upload-artifact@v4
        with:
          name: IPTVPlayer-apk
          path: |
            IPTVPlayer.apk
            IPTVPlayer-Rosa.apk

      - name: Publicar versão (link direto de instalação)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: IPTV Player v1.0.${{ github.run_number }}
          body: "Versão verde: IPTVPlayer.apk • Versão rosa: IPTVPlayer-Rosa.apk. Baixe e abra no celular para instalar."
          make_latest: true
          files: |
            IPTVPlayer.apk
            IPTVPlayer-Rosa.apk
